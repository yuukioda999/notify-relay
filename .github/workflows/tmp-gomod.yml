# Temporary: go.sum cannot be generated in the development environment (no Go module proxy).
# Removed before the pull request is merged.
name: tmp-gomod
on:
  push:
    branches: [feat/010-otel]
permissions:
  contents: read
jobs:
  gomod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: false
      - run: |
          go get golang.org/x/net@latest
          go mod tidy
          echo "=====GOMOD====="; cat go.mod; echo "=====GOSUM====="; cat go.sum; echo "=====END====="
          go vet ./... && go run golang.org/x/vuln/cmd/govulncheck@latest ./...
